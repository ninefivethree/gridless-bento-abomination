<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox bento abomination</title>

    <style>
        body {
            background-color: black;
            height: 100svh;
            margin: 0;
            padding: 0;

            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        * {
            &[quarter-width] {
                width: 25%;
            }

            &[third-width] {
                width: 33%;
            }

            &[third-height] {
                height: 33%;
            }

            &[quarter-height] {
                height: 25%;
            }

            &[parent] {
                height: 100svh;
            }
        }

        frow {
            display: flex;

            /* placebo */
            flex-grow: 1;

            flex-direction: row;
            width: 100%;
            height: 100%;
            gap: 1rem;
        }

        fcol {
            display: flex;
            flex-grow: 1;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 1rem;
        }

        box {
            width: 100%;
            height: 100%;
            background-color: #222;
            color: #eee;
            border-radius: 1rem;
        }

        .box-content {
            display: flex;
            align-items: start;
            justify-content: start;
            flex-direction: column;

            padding: 0rem 1rem;

            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <frow parent>
        <fcol>
            <frow>
                <fcol third-width>
                    <box>
                        <div class="box-content">
                            <p>oh yeah</p>
                        </div>
                    </box>
                    <box third-height>
                        <div class="box-content">
                            <p>oh yeah</p>
                        </div>
                    </box>
                </fcol>
                <fcol>
                    <frow third-height>
                        <box>
                            <div class="box-content">
                                <p>oh yeah</p>
                            </div>
                        </box>
                        <box>
                            <div class="box-content">
                                <p>oh yeah</p>
                            </div>
                        </box>
                    </frow>
                    <box>
                        <div class="box-content">
                            <p>oh yeah</p>
                        </div>
                    </box>
                </fcol>
            </frow>
            <frow quarter-height>
                <box>
                    <div class="box-content">
                        <p>oh yeah</p>
                    </div>
                </box>
                <box quarter-width>
                    <div class="box-content">
                        <p>oh yeah</p>
                    </div>
                </box>
            </frow>
        </fcol>
        <fcol quarter-width>
            <box>
                <div class="box-content">
                    <p>oh yeah</p>
                </div>
            </box>
            <box>
                <div class="box-content">
                    <p>oh yeah</p>
                </div>
            </box>
        </fcol>
    </frow>
</body>

</html>
